[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "premier-exchange"
version = "0.1.0"
description = "Paper-first, risk-controlled trading platform foundation"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0.0"]

[project.scripts]
premier-exchange = "premier_exchange.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
